# ============================================================
# Wealthsimple 信用卡 -> 一木记账 分类映射配置
# 配合 ws2yimu.py 使用
#
# 三张表,生命周期不同:
#   [taxonomy]     你的分类体系。权威表,另外两张表的右侧应当在这里存在
#   [category_map] WS category -> (一级, 二级)。默认映射,精确匹配
#   [merchant_map] 商户 -> (一级, 二级)。覆盖 category_map,子串匹配
#
# 填写方式:把所有 "我自定义的一级分类" / "我自定义的二级分类"
# 替换成你一木里的**确切**字符串。
#
# 一木不会校验分类是否存在,写错字它会静默创建一个新分类。
# 脚本加载时会比对 taxonomy 并打印告警,但不会中止、不会改数据——
# 告警出现时自己决定怎么处理。
# ============================================================


[settings]
# 未命中时使用的哨兵一级分类。一木会自动创建它,这是故意的:
# 它是一个自清空的待办队列,在一木里筛选它 -> 批量编辑 -> 处理完就空了。
# 不要用 "其他",那会和你真实的"其他"消费混在一起洗不出来。
# 未命中行的二级分类会自动填 WS 的原始 category 作为线索。
sentinel_l1 = "待分类"

# 一木里已建好的账户名,必须完全一致
account = "我自定义的账户名"


# ============================================================
# [taxonomy] 你的分类体系
# 格式:"一级分类" = ["二级分类", "二级分类", ...]
# 下面是占位,按你自己的体系改写
# ============================================================
[taxonomy]
"我自定义的一级分类" = ["我自定义的二级分类", "我自定义的二级分类"]


# ============================================================
# [category_map] WS category -> (一级, 二级)
#
# 下面 9 个是 2026-09-01 那份导出里实际出现的全部 category 值。
# WS 的完整集合肯定不止这些,遇到新值脚本会在"未命中映射"里打印,
# 到时候往下加即可。
#
# 注意 WS 的粒度取向:Coffee 被单独拆出来(返现档位驱动),
# 而 "Gas, parking, and tolls" 把加油和停车合成一桶。
# 这类错配靠 [merchant_map] 逐个覆盖。
# ============================================================
[category_map]

# --- 食品饮料 ---
"Groceries"            = ["我自定义的一级分类", "我自定义的二级分类"]
"Restaurants"          = ["我自定义的一级分类", "我自定义的二级分类"]
"Coffee"               = ["我自定义的一级分类", "我自定义的二级分类"]
"Other food and drink" = ["我自定义的一级分类", "我自定义的二级分类"]  # 烘焙店落在这里

# --- 交通 ---
"Gas, parking, and tolls" = ["我自定义的一级分类", "我自定义的二级分类"]  # 加油+停车混桶
"Other transportation"    = ["我自定义的一级分类", "我自定义的二级分类"]

# --- 购物 ---
"Clothing"       = ["我自定义的一级分类", "我自定义的二级分类"]
"Other shopping" = ["我自定义的一级分类", "我自定义的二级分类"]  # 垃圾桶类目

# --- 旅行 ---
"Other travel" = ["我自定义的一级分类", "我自定义的二级分类"]


# ============================================================
# [merchant_map] 商户覆盖
#
# key 必须是**规范化之后**的商户名,而且是**子串匹配**:
# 脚本会剥掉支付网关前缀(Sq */Priceln*)、订单号(/48901789128)、
# 门店号(#1028 / C12579)、.ca/.com,然后转小写。
# 所以写 "shell" 就能命中 "Shell C12579",不要写完整原文。
#
# 多个 key 同时命中时,较长的 key 优先。
# 只写你对 WS 默认归类不满意的商户,不需要穷举。
# ============================================================
[merchant_map]

# WS 归成 "Gas, parking, and tolls",但这是加油不是停车
"shell" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Other shopping",但这是办公/文具
"staples" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Other shopping",但这是日用杂货
"miniso" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Other food and drink",烘焙店你可能想单独归
"saint germain bakery" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Other travel",Priceline 订的住宿(原文被截断,用尾部子串)
"capsule reside" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Other transportation",MTO = 安省交通厅(车牌/驾照)
"mto tsd" = ["我自定义的一级分类", "我自定义的二级分类"]

# WS 归成 "Restaurants",但这是烹饪课,更像娱乐/学习
"gusta cooking studio" = ["我自定义的一级分类", "我自定义的二级分类"]

# 商户名被 WS 弄糊了,category 是 "Gas, parking, and tolls",
# $12 更像停车费。确认后再决定留不留
# "torprkaut" = ["我自定义的一级分类", "我自定义的二级分类"]