# ============================================================
# Wealthsimple credit card -> Yimu Bookkeeping category mapping.
# Used by ws2yimu.py.
#
# Three tables with different lifecycles:
#   [taxonomy]     Your category tree. The authority; the right-hand side of
#                  the other two tables should exist here.
#   [category_map] WS category -> (top-level, subcategory). Exact match.
#   [merchant_map] Merchant -> (top-level, subcategory). Substring match,
#                  overrides category_map.
#
# Replace every placeholder with the exact string used in Yimu.
#
# Yimu does not validate categories: a typo silently creates a new one. The
# script checks values against [taxonomy] and prints a warning, but does not
# halt and does not alter data — decide for yourself when a warning appears.
# ============================================================


[settings]
# Sentinel top-level category for unmatched rows. Yimu will create it, which
# is intentional: it is a self-emptying to-do queue — filter by it in Yimu,
# batch-edit, and it is gone.
# Do not use "其他" — those rows would mix with genuinely uncategorized
# spending and could not be separated again.
# The subcategory of an unmatched row holds the raw WS category as a hint.
sentinel_l1 = "待分类"

# Ledger name as it exists in Yimu; must match exactly.
account = "测试"
# Account name as it exists in Yimu; must match exactly.
dataFrom = "WealthSimple" 


# ============================================================
# [taxonomy] Your category tree.
# Format: "top-level" = ["subcategory", "subcategory", ...]
# Placeholder below; rewrite it to match your own structure.
# ============================================================
[taxonomy]
"自定义的一级分类" = ["自定义的二级分类", "自定义的二级分类"]


# ============================================================
# [category_map] WS category -> (top-level, subcategory)
#
# The nine entries below are every category value that appeared in the
# 2026-09-01 export. WS's full set is certainly larger; new values are listed
# under "Unmatched" when the script runs and can be added here as they show up.
#
# Note WS's granularity: Coffee is split out on its own (driven by cashback
# tiers), while "Gas, parking, and tolls" merges fuel and parking into one
# bucket. Mismatches like that are handled case by case in [merchant_map].
# ============================================================
[category_map]

# --- Food and drink ---
"Groceries"            = ["Grocery", ""]
"Restaurants"          = ["食品餐饮", "外食"]
"Coffee"               = ["食品餐饮", "饮料酒水"]
"Other food and drink" = ["食品餐饮", "外食"]  # bakeries land here

# --- Transportation ---
"Gas, parking, and tolls" = ["出行交通", "加油"]  # fuel and parking combined
"Other transportation"    = ["出行交通", "车"]

# --- Shopping ---
"Clothing"       = ["购物消费", "服饰运动"]
"Other shopping" = ["购物消费", "其他"]  # catch-all category

# --- Travel ---
"Other travel" = ["其他", "旅游"]


# ============================================================
# [merchant_map] Per-merchant overrides.
#
# Keys must be the **normalized** merchant name, and are matched as a
# **substring**: the script strips payment gateway prefixes (Sq */Priceln*),
# order ids (/48901789128), store numbers (#1028 / C12579) and .ca/.com, then
# lowercases what is left. So "shell" matches "Shell C12579" — do not write
# the full original string.
#
# When several keys match, the longer one wins.
# Only list merchants whose default WS categorization you disagree with;
# there is no need to be exhaustive.
# ============================================================
[merchant_map]

# WS says "Other shopping", but this is office supplies.
"staples" = ["购物消费", "办公用品"]

# WS says "Other shopping", but this is household goods.
"miniso" = ["购物消费", "日常家居"]

# WS says "Other travel"; lodging booked through Priceline. The original name
# is truncated, so the key uses the trailing substring.
"capsule reside" = ["其他", "旅游"]

# Merchant name mangled by WS; category is "Gas, parking, and tolls", and $12
# looks more like parking.
"torprkaut" = ["出行交通", "停车费"]
"spothero" = ["出行交通", "停车费"]